<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 에스앤에스프로 교육원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--neutral-100);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: white;
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      padding: 48px 40px;
      width: 100%;
      max-width: 460px;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: var(--primary-50);
      color: var(--primary-500);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 20px;
    }

    .login-title {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--neutral-900);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: var(--font-size-sm);
      color: var(--neutral-500);
      text-align: center;
      margin-bottom: 32px;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--neutral-200);
      margin-bottom: 28px;
      position: relative;
    }
    .auth-tab {
      flex: 1;
      padding: 10px 0;
      font-size: var(--font-size-base);
      font-weight: 500;
      color: var(--neutral-500);
      cursor: pointer;
      text-align: center;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition-base);
      font-family: var(--font-primary);
    }
    .auth-tab.active {
      color: var(--primary-600);
      border-bottom-color: var(--primary-500);
    }

    /* Forms */
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* Divider */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--neutral-400);
      font-size: var(--font-size-sm);
    }
    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--neutral-200);
    }

    /* Google Button */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 20px;
      border: 1.5px solid var(--neutral-300);
      border-radius: var(--radius-md);
      background: white;
      color: var(--neutral-800);
      font-family: var(--font-primary);
      font-size: var(--font-size-base);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-base);
    }
    .btn-google:hover {
      background: var(--neutral-50);
      border-color: var(--neutral-400);
    }
    .btn-google svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Submit Button */
    .btn-login-submit {
      width: 100%;
      justify-content: center;
      font-size: var(--font-size-base);
      padding: 12px 20px;
    }

    /* Forgot password */
    .forgot-pw {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }
    .forgot-pw a {
      font-size: var(--font-size-sm);
      color: var(--primary-600);
      text-decoration: none;
    }
    .forgot-pw a:hover { text-decoration: underline; }

    /* Auth message */
    #authMessage {
      margin-top: 16px;
      font-size: var(--font-size-sm);
      text-align: center;
      min-height: 20px;
    }

    /* Back link */
    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-size-sm);
      color: var(--neutral-500);
      text-decoration: none;
      margin-bottom: 28px;
    }
    .back-link:hover { color: var(--primary-600); }
  </style>
</head>
<body>

  <div class="login-card">
    <a href="index.html" class="back-link">
      <i class="ti ti-arrow-left"></i> 홈으로 돌아가기
    </a>

    <div class="login-logo">
      <i class="ti ti-video"></i>
    </div>
    <h1 class="login-title">에스앤에스프로 교육원</h1>
    <p class="login-subtitle">자격증 신청 및 마이페이지 이용을 위한 로그인</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">로그인</button>
      <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">회원가입</button>
    </div>

    <!-- Login Form -->
    <div id="formLogin" class="auth-form active">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input id="loginEmail" class="form-input" type="email" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input id="loginPassword" class="form-input" type="password" placeholder="비밀번호" autocomplete="current-password">
      </div>
      <div class="forgot-pw">
        <a href="#" id="forgotPwLink">비밀번호를 잊으셨나요?</a>
      </div>
      <button id="loginSubmitBtn" class="btn btn-primary btn-login-submit">
        <i class="ti ti-login"></i> 로그인
      </button>
    </div>

    <!-- Signup Form -->
    <div id="formSignup" class="auth-form">
      <div class="form-group">
        <label class="form-label">이름 <span class="required">*</span></label>
        <input id="signupName" class="form-input" type="text" placeholder="홍길동">
      </div>
      <div class="form-group">
        <label class="form-label">이메일 <span class="required">*</span></label>
        <input id="signupEmail" class="form-input" type="email" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 <span class="required">*</span></label>
        <input id="signupPassword" class="form-input" type="password" placeholder="8자 이상 입력해 주세요" autocomplete="new-password">
        <p class="form-hint">영문, 숫자 포함 8자 이상</p>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 확인 <span class="required">*</span></label>
        <input id="signupPasswordConfirm" class="form-input" type="password" placeholder="비밀번호를 다시 입력해 주세요" autocomplete="new-password">
      </div>
      <button id="signupSubmitBtn" class="btn btn-primary btn-login-submit">
        <i class="ti ti-user-plus"></i> 회원가입
      </button>
    </div>

    <!-- Auth Message -->
    <div id="authMessage"></div>

    <!-- Google Login (공통) -->
    <div class="or-divider">또는</div>
    <button class="btn-google" id="googleLoginBtn">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Google 계정으로 로그인
    </button>
  </div>

  <script type="module" src="login.js"></script>
  <script>
    function switchTab(tab) {
      document.getElementById('formLogin').classList.toggle('active', tab === 'login');
      document.getElementById('formSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('authMessage').innerHTML = '';
    }
  </script>
</body>
</html>
